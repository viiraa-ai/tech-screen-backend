services:
  postgres:
    image: postgres:16-alpine
    container_name: viiraa_chat_pg
    environment:
      POSTGRES_USER: viiraa
      POSTGRES_PASSWORD: viiraa
      POSTGRES_DB: viiraa_chat
    ports:
      - '5432:5432'
    volumes:
      - viiraa_pg_data:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U viiraa -d viiraa_chat']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  viiraa_pg_data:
